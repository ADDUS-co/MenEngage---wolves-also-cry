(() => {
  const preference = matchMedia('(prefers-reduced-motion: reduce)');
  if (!('IntersectionObserver' in window) || !Element.prototype.animate) return;
  const running = new Set();
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      observer.unobserve(entry.target);
      if (preference.matches) return;
      const animation = entry.target.animate(
        [{opacity:0, transform:'translateY(22px)'},{opacity:1,transform:'translateY(0)'}],
        {duration:750,easing:'cubic-bezier(.2,.75,.25,1)',fill:'none'}
      );
      running.add(animation);
      animation.onfinish = animation.oncancel = () => running.delete(animation);
    });
  }, {threshold:.08});
  document.querySelectorAll('.hero-grid>div:first-child,.section-top,.about-grid>div,#rules>.wrap>.label,#rules h2,.step,.agreement,.signup-grid>div,.signup form,.foot').forEach(element => observer.observe(element));
  preference.addEventListener('change', event => {
    if (event.matches) running.forEach(animation => animation.cancel());
  });
})();
