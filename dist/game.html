rotate:'Вращать',done:'Готово',aboutLabel:'02 / Больше, чем игра',aboutTitle:'Быть собой —<br><span>тоже можно.</span>',aboutCopy:'Нас часто учат, каким должен быть мужчина. Реже спрашивают, как мы себя чувствуем и как наши поступки влияют на других. Эта колода приглашает поговорить об этом — с любопытством, уважением и готовностью слушать.',quote:'Можно чувствовать.<br>Можно просить поддержки.<br>Можно выбирать по-своему.',norms:'«Не плачь». «Всегда побеждай». «Не проси помощи». «Контролируй». Жёсткие ожидания могут мешать нам понимать себя и причинять боль окружающим. Разговор помогает замечать эти установки и искать другие способы действовать.',values:'Забота о себе идёт рядом с уважением к другим: гендерным равенством, правами женщин, уважением к разным идентичностям, отказом от насилия и ответственностью за свои поступки.',rulesLabel:'03 / Просто начните',rulesTitle:'Вытяни. Поделись.<br>Послушай.',ruleNote:'Здесь нет баллов, победителей и правильных ответов.',bigGroup:'Большая компания? Разделитесь на небольшие круги, чтобы у каждого было время высказаться.',agreement:'Сначала —<br>договоримся.',signupLabel:'Продолжим разговор?',signupTitle:'Хочешь узнать,<br>когда появится<br>колода?',signupCopy:'Оставь контакт — получи новости о выпуске и возможности попробовать игру.',formNote:'Демонстрационная форма. Отправка пока не подключена: введённые данные никуда не передаются и не сохраняются.',nameLabel:'Имя — необязательно',emailLabel:'Email',commentLabel:'Комментарий — необязательно',consent:'Согласен(-на) на обработку данных для получения новостей о колоде. Политика обработки данных будет добавлена перед запуском приёма заявок.',submit:'Хочу узнать о выпуске ↗',invalid:'Укажи корректный email, например name@example.com.',needConsent:'Отметь согласие, чтобы проверить форму.',demoStatus:'Форма заполнена корректно. Это демонстрация: заявка не отправлена. Введённые поля остаются на странице.',disclaimer:'Авторская концепция разговорной игры в контексте ценностей MenEngage. Вопросы и дизайн не являются официально утверждённым продуктом организации.',translationNote:'Казахская версия — черновой перевод, ожидающий редакторской проверки.',principles:'Принципы MenEngage ↗',pass:'Можно пропустить',questionWord:'Вопрос'},kk:{name:'Айтуға<br>болады',nameInline:'Айтуға болады ↗',aboutNav:'Ойын туралы',tryNav:'Байқап көру',rulesNav:'Қалай ойнаймыз',apply:'Өтінім қалдыру',eyebrow:'Шынайы әңгімеге арналған карталар',headline:'Бәрін іште<br>ұстау <span>міндет емес.</span>',lead:'Ер адам болу туралы әңгімеге арналған карта ойыны. Сезімдер, күтулер, қарым-қатынас және өзің болуды таңдау туралы.',openFirst:'Алғашқы картаны ашу',players:'2 қатысушыдан бастап',noHost:'Жүргізушісіз',sticker:'Бетперде аз.<br>Өзіңе жақын.',cardTag:'ӘҢГІМЕ СЕНЕН БАСТАЛАДЫ',heroHint:'Әңгімені бастау үшін колоданы бас',ticker1:'СЕЗІНУГЕ БОЛАДЫ',ticker2:'КҮМӘНДАНУҒА БОЛАДЫ',ticker3:'ӨЗІҢ БОЛУҒА БОЛАДЫ',demoLabel:'01 / Байқап көр',demoTitle:'Бір сұрақ.<br>Әңгіменің бастауы.',demoIntro:'Картаны таңда. Аударып көр.<br>Мүмкін, дәл осы әңгіменің уақыты келген шығар.',demoHint:'Аудару үшін бас. Айналдыру үшін сүйре. Телефонда картаның астындағы «Айналдыру» батырмасын қос. Пернетақта: Enter — аудару, бағыттауыштар — айналдыру, Escape — қалпына келтіру.',next:'Келесі сұрақ ↗',skip:'Өткізіп жіберу',textMode:'Мәтіндік режим',hideText:'Тізімді жасыру',flip:'Аудару',reset:'Бұрылысын қалпына келтіру',rotate:'Айналдыру',done:'Дайын',aboutLabel:'02 / Ойыннан да артық',aboutTitle:'Өзің болуға да<br><span>болады.</span>',aboutCopy:'Бізге ер адамның қандай болуы керегін жиі айтады. Ал не сезінетінімізді және іс-әрекетіміз өзгелерге қалай әсер ететінін сирек сұрайды. Бұл колода осыны қызығушылықпен, құрметпен және тыңдауға дайын болып талқылауға шақырады.',quote:'Сезінуге болады.<br>Қолдау сұрауға болады.<br>Өз жолыңды таңдауға болады.',norms:'«Жылама». «Әрқашан жең». «Көмек сұрама». «Бақылауда ұста». Қатаң күтулер өзімізді түсінуге кедергі болып, айналамыздағы адамдарға зиян келтіруі мүмкін. Әңгіме осы ұстанымдарды байқап, әрекет етудің басқа жолдарын табуға көмектеседі.',values:'Өзіңе қамқор болу өзгелерді құрметтеумен қатар жүреді: гендерлік теңдік, әйелдердің құқықтары, әртүрлі болмысты құрметтеу, зорлық-зомбылықтан бас тарту және өз іс-әрекетіңе жауапкершілік алу.',rulesLabel:'03 / Бастау оңай',rulesTitle:'Карта ал. Бөліс.<br>Тыңда.',ruleNote:'Мұнда ұпай, жеңімпаз және дұрыс жауап жоқ.',bigGroup:'Қатысушылар көп пе? Әркімнің сөйлеуге уақыты болуы үшін шағын топтарға бөлініңдер.',agreement:'Алдымен<br>келісіп алайық.',signupLabel:'Әңгімені жалғастырамыз ба?',signupTitle:'Колоданың қашан<br>шығатынын білгің<br>келе ме?',signupCopy:'Байланысыңды қалдыр — колоданың шығуы және ойынды байқап көру мүмкіндігі туралы жаңалық ал.',formNote:'Бұл — үлгі форма. Жіберу қызметі әлі қосылмаған: енгізілген деректер ешқайда жіберілмейді және сақталмайды.',nameLabel:'Аты-жөнің — міндетті емес',emailLabel:'Электрондық пошта',commentLabel:'Пікір — міндетті емес',consent:'Колода туралы жаңалық алу үшін деректерімді өңдеуге келісемін. Деректерді өңдеу саясаты өтінім қабылдау басталғанға дейін қосылады.',submit:'Шығарылым туралы білгім келеді ↗',invalid:'Дұрыс электрондық пошта мекенжайын енгіз, мысалы name@example.com.',needConsent:'Форманы тексеру үшін келісімді белгіле.',demoStatus:'Форма дұрыс толтырылды. Бұл — үлгі: өтінім жіберілген жоқ. Енгізілген мәліметтер бетте қалды.',disclaimer:'MenEngage құндылықтарына негізделген авторлық ойын тұжырымдамасы. Сұрақтар мен дизайн ұйым ресми түрде мақұлдаған өнім емес.',translationNote:'Қазақша нұсқа — редактор тексеруін күтетін аударма жобасы.',principles:'MenEngage қағидаттары ↗',pass:'Өткізіп жіберуге болады',questionWord:'Сұрақ'}};

const questions={ru:['Какие слова поддержки тебе хотелось бы слышать чаще?','Как ты замечаешь, что тебе нужна пауза или помощь?','Как можно дать другу понять, что рядом с тобой можно говорить о чувствах?','Какое «мужчина должен» тебе хотелось бы поставить под вопрос?','Бывало ли, что ты отказывался от интересного занятия, потому что его считали «не мужским»? Можно ответить на вымышленном примере.','Какие качества ты ценишь в человеке независимо от его пола?','Где для тебя проходит граница между заботой и контролем?','Как можно отреагировать на чужое «нет», даже если ты расстроен?','Как спросить, комфортны ли человеку объятия, прикосновение или личный вопрос, не оказывая давления?','Какие повседневные дела заботы ты мог бы брать на себя без напоминания?','Что помогает распределять домашние обязанности справедливо?','Какую привычку заботиться о близких ты хотел бы перенять или создать сам?','Что можно сказать, если в компании прозвучала шутка, унижающая женщин или человека за его непохожесть?','Как выглядит извинение, после которого действительно меняется поведение?','Какую одну привычку в общении ты хотел бы изменить, чтобы рядом с тобой другим было спокойнее?'],kk:['Қандай қолдау сөздерін жиірек естігің келеді?','Үзіліс не көмек қажет екенін қалай байқайсың?','Досыңа сенімен сезімдері туралы еркін сөйлесе алатынын қалай білдіруге болады?','«Ер адам міндетті» деген қандай талапты қайта қарастырғың келеді?','Қызыққан ісіңнен оны «ерлерге тән емес» деп санағандықтан бас тартқан кезің болды ма? Ойдан шығарылған мысалмен жауап беруге болады.','Адамның жынысына қарамастан қандай қасиеттерін бағалайсың?','Сен үшін қамқорлық пен бақылаудың арасындағы шекара қай жерде?','Көңілің қалса да, өзгенің «жоқ» деген жауабын қалай қабылдауға болады?','Адамға қысым жасамай, құшақтау, қол тигізу немесе жеке сұрақ қою оған жайлы ма екенін қалай сұрауға болады?','Қандай күнделікті қамқорлық істерін еске салусыз өз мойныңа ала алар едің?','Үй шаруасын әділ бөлуге не көмектеседі?','Жақындарыңа қамқорлық жасаудың қандай әдетін үйренгің немесе қалыптастырғың келеді?','Ортада әйелдерді немесе өзгеше болғаны үшін біреуді кемсітетін әзіл айтылса, не деуге болады?','Мінез-құлықты шынымен өзгертетін кешірім сұрау қандай болады?','Жаныңда өзгелер өздерін жайлырақ сезінуі үшін қарым-қатынастағы қандай бір әдетіңді өзгерткің келеді?']};
const steps={ru:['Соберитесь от двух человек и договоритесь об уважительном разговоре.','По очереди вытягивайте карточку и читайте вопрос.','Отвечайте в том объёме, в котором вам комфортно. Остальные слушают.','Передавайте ход дальше. Любой вопрос можно пропустить.'],kk:['Екі не одан көп адам жиналып, құрметпен сөйлесуге келісіңдер.','Кезекпен карта алып, сұрақты оқыңдар.','Өзіңе жайлы көлемде жауап бер. Қалғандары тыңдайды.','Кезекті келесі адамға бер. Кез келген сұрақты өткізіп жіберуге болады.']};

copy.en={"name":"WOLVES<br>ALSO CRY","nameInline":"Wolves Also Cry","aboutNav":"About","tryNav":"Try it","rulesNav":"How to play","apply":"Join the waitlist","eyebrow":"Cards for real conversations","headline":"You do not have to<br>keep it all <span>inside.</span>","lead":"A conversation card game about being a man. About feelings, expectations, relationships and choosing to be yourself.","openFirst":"Open the first card","players":"2 or more players","noHost":"No facilitator needed","sticker":"Fewer masks.<br>More you.","cardTag":"THE CONVERSATION STARTS WITH YOU","heroHint":"Tap the deck to start a conversation","ticker1":"YOU CAN FEEL","ticker2":"YOU CAN QUESTION","ticker3":"YOU CAN BE YOURSELF","demoLabel":"01 / Give it a try","demoTitle":"One question.<br>A conversation begins.","demoIntro":"Choose a card. Turn it over.<br>Maybe this conversation has been waiting for its moment.","demoHint":"Tap to flip. Drag to rotate. On mobile, enable Rotate below the card. Keyboard: Enter to flip, arrow keys to rotate, Escape to reset.","next":"Next question ↗","skip":"Skip","textMode":"Text mode","hideText":"Hide list","flip":"Flip","reset":"Reset rotation","rotate":"Rotate","done":"Done","aboutLabel":"02 / More than a game","aboutTitle":"You can be<br><span>yourself.</span>","aboutCopy":"We are often taught what a man should be. We are asked less often how we feel and how our actions affect others. This deck invites us to explore that with curiosity, respect and a willingness to listen.","quote":"You can feel.<br>You can ask for support.<br>You can choose your own way.","norms":"“Do not cry.” “Always win.” “Do not ask for help.” “Stay in control.” Rigid expectations can keep us from understanding ourselves and hurt people around us. Conversation helps us notice these beliefs and find other ways to act.","values":"Caring for yourself goes hand in hand with respect for others: gender equality, women’s rights, respect for different identities, nonviolence and responsibility function renderCards(){const host=document.getElementById('cards');host.innerHTML=indices.map((q,i)=>'<div class="card-slot"><div class="card-object" tabindex="0" role="button" data-card="'+i+'"><div class="face back"><div class="card-meta"><span>16+</span><span>'+String(q+1).padStart(2,'0')+'</span></div><div class="card-logo">'+copy[lang].name+'</div><div class="big-symbol"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><g stroke="#D7FF3F" stroke-width="1.65" stroke-linejoin="miter" stroke-linecap="square"><path d="M12 10 37 26 50 21 63 26 88 10 76 67 50 88 24 67Z"/><path d="M12 10 39 50 50 79 61 50 88 10M18.5 43 39 50 24 67M81.5 43 61 50 76 67M50 79 50 88M42 69 58 69 50 79Z"/><path d="m39 50-12-6 2 6m32 0 12-6-2 6"/></g></svg></div><div class="card-bottom"><span>'+copy[lang].cardTag+'</span></div></div><div class="face front"><div class="category">'+categories[lang][Math.floor(q/3)]+'</div><div class="question"'+(questions[lang][q].length>125?' style="font-size:18px"':'')+'>'+questions[lang][q]+'</div><div class="card-bottom"><span>'+copy[lang].pass+'</span><span>'+String(q+1).padStart(2,'0')+'</span></div></div></div><div class="card-controls"><button data-flip="'+i+'">'+copy[lang].flip+'</button><button data-reset="'+i+'">'+copy[lang].reset+'</button><button data-rotate="'+i+'" aria-pressed="'+states[i].rotate+'">'+copy[lang][states[i].rotate?'done':'rotate']+'</button></div></div>').join('');host.querySelectorAll('[data-card]').forEach((el,i)=>{update(i);bindCard(el,i)});host.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>flip(+b.dataset.flip));host.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>reset(+b.dataset.reset));host.querySelectorAll('[data-rotate]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rotate;states[i].rotate=!states[i].rotate;b.textContent=copy[lang][states[i].rotate?'done':'rotate'];b.setAttribute('aria-pressed',states[i].rotate);update(i)})}
function update(i){const s=states[i],el=document.querySelector('[data-card="'+i+'"]');el.style.transform='rotateX('+s.x+'deg) rotateY('+s.y+'deg)';el.style.touchAction=s.rotate?'none':'pan-y';el.classList.toggle('flat-front',s.front);el.classList.toggle('flat-back',!s.front);el.setAttribute('aria-label',s.front?questions[lang][indices[i]]:copy[lang].questionWord+' '+(indices[i]+1)+'. '+copy[lang].flip);el.querySelector('.back').setAttribute('aria-hidden',s.front);el.querySelector('.front').setAttribute('aria-hidden',!s.front)}
function flip(i){active=i;states[i].front=!states[i].front;states[i].x=0;states[i].y=states[i].front?180:0;update(i)}function reset(i){active=i;states[i].x=0;states[i].y=states[i].front?180:0;update(i)}

(() => {
  const preference = matchMedia('(prefers-reduced-motion: reduce)');
  if (!('IntersectionObserver' in window) || !Element.prototype.animate) return;
  const running = new Set();
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      observer.unobserve(entry.target);
      if (preference.matches) return;
      const animation = entry.target.animate(
        [{opacity:0, transform:'translateY(22px)'},{opacity:1,transform:'translateY(0)'}],
        {duration:750,easing:'cubic-bezier(.2,.75,.25,1)',fill:'none'}
      );
      running.add(animation);
      animation.onfinish = animation.oncancel = () => running.delete(animation);
    });
  }, {threshold:.08});
  document.querySelectorAll('.hero-grid>div:first-child,.section-top,.about-grid>div,#rules>.wrap>.label,#rules h2,.step,.agreement,.signup-grid>div,.signup form,.foot').forEach(element => observer.observe(element));
  preference.addEventListener('change', event => {
    if (event.matches) running.forEach(animation => animation.cancel());
  });
})();
</script></body></html>
